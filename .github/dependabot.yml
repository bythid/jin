# Dependabot runs on the GitHub mirror. Dev dependencies only — the library
# has no runtime dependencies, so these PRs are tooling updates, each gated
# by the ci workflow before it can land.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      devtools:
        dependency-type: development
    ignore:
      # The declaration build drives the JavaScript Compiler API, which the
      # native compiler no longer ships, so a TypeScript major is a toolchain
      # migration rather than a weekly dependency bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
