name: publish

# Cutting a release stays exactly as CHANGELOG.md describes: one commit on
# main that bumps package.json and adds the entry, tagged vX.Y.Z. The dual
# push carries the tag here, and this workflow is the publish button.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # OIDC token for npm trusted publishing and --provenance. No npm token is
  # stored anywhere; the package's trusted-publisher setting names this file.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Local wall time for verify + smoke is ~2 minutes; 20 covers cold CI
    # caches with slack. The point is to fail loudly instead of hanging for
    # the 6-hour default — the first v0.2.0 run sat in this step unseen.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The version comes from package.json's `devEngines.packageManager`, which
      # this action reads, so it is stated once and in one place. It must run
      # before setup-node, whose `cache: pnpm` needs the store path to exist.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Node 22 bundles npm 10.9.x. Trusted publishing needs npm CLI 11.5.1 or
      # later and staged publishing needs 11.15.0, so without this the OIDC
      # exchange has no client that can perform it.
      - run: npm install -g npm@^11.15.0

      - run: pnpm install --frozen-lockfile

      # prepublishOnly runs `verify && smoke` first, so the gates still cannot
      # be skipped — they just run here instead of on a laptop. The version is
      # staged rather than released: the trusted publisher is configured for
      # staged publishing only, so an action compromised in this workflow can
      # reach the queue but never the consumers. Provenance rides on the OIDC
      # token, and a maintainer approves the staged version from a trusted
      # device with `npm stage approve`.
      #
      # PYTHONUNBUFFERED: the smoke script's step labels are python prints, and
      # on CI stdout is block-buffered — a hung step showed nothing after the
      # pnpm banner, so "which step" was invisible. notice-level npm logging
      # exposes the staging upload itself.
      - run: npm stage publish --access public --loglevel notice
        env:
          PYTHONUNBUFFERED: '1'
